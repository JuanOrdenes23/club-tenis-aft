<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Club Tenis AFT</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#f4f6fb;font-family:'Segoe UI',sans-serif;color:#1b1b1b}
    .app{max-width:480px;margin:0 auto;min-height:100vh}
    .header{background:linear-gradient(135deg,#0a1f5c 0%,#1a3a8f 100%);color:#fff;padding-top:16px;box-shadow:0 3px 12px rgba(0,0,0,0.2);position:relative;overflow:hidden}
    .header-top{padding:0 16px 14px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
    .header-info .liga{font-size:11px;letter-spacing:2px;opacity:.7;text-transform:uppercase}
    .header-info .count{font-size:11px;opacity:.6;margin-top:2px}
    .tabs{display:flex;position:relative;z-index:1}
    .tab-btn{flex:1;padding:10px 4px;border:none;cursor:pointer;font-size:11px;background:transparent;color:#fff;border-bottom:3px solid transparent;transition:all .2s;text-align:center}
    .tab-btn.active{background:rgba(255,255,255,0.15);font-weight:700;border-bottom:3px solid #f0c040}
    .tab-icon{font-size:18px}
    .content{padding:16px 14px;position:relative}
    .court-bg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.045;pointer-events:none;z-index:0;max-width:480px;width:100%}
    .content-inner{position:relative;z-index:1}
    .section-title{font-weight:700;font-size:16px;color:#0a1f5c;margin-bottom:2px}
    .section-sub{font-size:13px;color:#888;margin-bottom:14px;letter-spacing:1px}
    .ranking-list{display:flex;flex-direction:column;gap:8px}
    .rank-card{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,0.04);display:flex;align-items:center;gap:12px}
    .rank-pos{min-width:32px;text-align:center;font-weight:700}
    .rank-name{font-weight:700;font-size:14px}
    .rank-detail{font-size:11px;color:#777;margin-top:2px}
    .rank-pts{text-align:right}
    .rank-pts-val{font-weight:800;font-size:20px;color:#0a1f5c}
    .rank-pts-lbl{font-size:10px;color:#aaa}
    .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.04)}
    .card-title{font-weight:600;font-size:13px;color:#0a1f5c;margin-bottom:8px}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .stat-card{background:#fff;border-radius:12px;padding:14px 10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.04)}
    .stat-icon{font-size:22px}
    .stat-val{font-weight:800;font-size:22px}
    .stat-lbl{font-size:11px;color:#888}
    .bar-wrap{display:flex;border-radius:8px;overflow:hidden;height:28px}
    .bar-left{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
    .bar-right{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
    .bar-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:12px}
    .history-item{border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,0.04);margin-bottom:8px}
    .history-names{font-weight:700;font-size:13px}
    .history-detail{font-size:11px;color:#888;margin-top:2px}
    .history-result{font-size:11px;margin-top:3px;font-weight:600}
    .player-history-item{padding-left:10px;margin-bottom:10px}
    .player-history-name{font-size:13px;font-weight:600}
    .player-history-date{font-size:11px;color:#999}
    select,input{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid #c5d3f0;font-size:14px;outline:none;background:#f8faff;margin-bottom:16px}
    .racket-svg{position:absolute;pointer-events:none}
    .ball{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d4f542,#a8cc00);box-shadow:0 2px 6px rgba(0,0,0,0.3);z-index:2;pointer-events:none}
    .ball::before,.ball::after{content:'';position:absolute;border:1.5px solid rgba(255,255,255,0.5);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
    .ball::before{width:60%;height:100%;border-left-color:transparent;border-right-color:transparent}
    .ball::after{width:100%;height:60%;border-top-color:transparent;border-bottom-color:transparent}
    @keyframes bounceX{
      0%,100%{left:5%}
      50%{left:82%}
    }
    @keyframes bounceY{
      0%,100%{top:5px}
      50%{top:calc(100% - 24px)}
    }
    .ball{
      animation:bounceX 4.5s ease-in-out infinite, bounceY 3s ease-in-out infinite;
    }
    @keyframes spin{
      0%{transform:rotateY(0deg)}
      50%{transform:rotateY(180deg)}
      100%{transform:rotateY(360deg)}
    }
    .medal{display:inline-block;animation:spin 2.5s ease-in-out infinite;}
    .ball-rank{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:900;font-size:13px;animation:spin 2.5s ease-in-out infinite;box-shadow:0 2px 8px rgba(0,0,0,0.25);position:relative;background:radial-gradient(circle at 35% 35%,#d4f542,#a8cc00)}
    .ball-rank::before{content:'';position:absolute;width:60%;height:100%;border:2px solid rgba(255,255,255,0.6);border-radius:50%;border-left-color:transparent;border-right-color:transparent}
    .ball-rank::after{content:'';position:absolute;width:100%;height:60%;border:2px solid rgba(255,255,255,0.6);border-radius:50%;border-top-color:transparent;border-bottom-color:transparent}
    .ball-rank span{position:relative;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,0.4)}
  </style>
</head>

function buildRanking(){
  const p={};
  const e=n=>{if(!p[n])p[n]={name:n,pts:0,played:0,won:0,lost:0};};
  MATCHES.forEach(m=>{
    e(m.w);e(m.l);
    p[m.w].played++;p[m.l].played++;
    p[m.w].pts+=10;p[m.w].won++;p[m.l].lost++;
  });
  return Object.values(p).sort((a,b)=>b.pts-a.pts||b.won-a.won);
}

}

function courtSVG(){
  return `<svg class="court-bg" viewBox="0 0 480 700" xmlns="http://www.w3.org/2000/svg">
    <rect x="60" y="60" width="360" height="580" fill="none" stroke="#0a1f5c" stroke-width="5"/>
    <rect x="100" y="60" width="280" height="580" fill="none" stroke="#0a1f5c" stroke-width="3"/>
    <line x1="60" y1="350" x2="420" y2="350" stroke="#0a1f5c" stroke-width="4"/>
    <line x1="60" y1="220" x2="420" y2="220" stroke="#0a1f5c" stroke-width="2"/>
    <line x1="240" y1="60" x2="240" y2="220" stroke="#0a1f5c" stroke-width="2"/>
    <line x1="60" y1="480" x2="420" y2="480" stroke="#0a1f5c" stroke-width="2"/>
    <line x1="240" y1="480" x2="240" y2="640" stroke="#0a1f5c" stroke-width="2"/>
    <line x1="55" y1="340" x2="55" y2="360" stroke="#0a1f5c" stroke-width="5"/>
    <line x1="425" y1="340" x2="425" y2="360" stroke="#0a1f5c" stroke-width="5"/>
  </svg>`;
}

function statBar(p,lL,lR,cL,cR){
  const cl=cL||'#3a7bd5', cr=cR||'#e05252';
  const r=100-p;
  return `<div class="bar-wrap">
    ${p>0?`<div class="bar-left" style="width:${p}%;background:${cl}">${p}%</div>`:''}
    ${r>0?`<div class="bar-right" style="width:${r}%;background:${cr}">${r}%</div>`:''}
  </div>
  <div class="bar-labels">
    <span style="color:${cl}">✅ ${lL}</span>
    <span style="color:${cr}">❌ ${lR}</span>
  </div>`;
}

function renderRanking(){
  const ranking=buildRanking();
  const medals=['🥇','🥈','🥉'];
  const borderColors=['#f9c74f','#adb5bd','#cd7f32'];
  return `
    <div class="section-title">🏆 Escalerilla General</div>
    <div class="section-sub">Liga 2026</div>
    <div class="ranking-list">
      ${ranking.map((p,i)=>`
        <div class="rank-card" style="border-left:5px solid ${i<3?borderColors[i]:'#0a1f5c'}">
          <div class="rank-pos">${i===0?'<div class="ball-rank"><span>1</span></div>':i===1?'<div class="ball-rank"><span>2</span></div>':i===2?'<div class="ball-rank"><span>3</span></div>':'<span style="font-size:15px;font-weight:700;color:#aaa">#'+(i+1)+'</span>'}</div>
          <div style="flex:1">
            <div class="rank-name">${p.name}</div>
            <div class="rank-detail">${p.played} PJ · ${p.won}G / ${p.lost}P · ${p.played?Math.round(p.won/p.played*100):0}%</div>
          </div>
          <div class="rank-pts">
            <div class="rank-pts-val">${p.pts}</div>
            <div class="rank-pts-lbl">pts</div>
          </div>
        </div>`).join('')}
    </div>`;
}

function renderStats(){
  const players=[...new Set(MATCHES.flatMap(m=>[m.w,m.l]))].sort();
  let body='';
  if(selPlayer){
    const pm=MATCHES.filter(m=>m.w===selPlayer||m.l===selPlayer);
    const pw=pm.filter(m=>m.w===selPlayer).length;
    const pl=pm.length-pw;
    const p=pct(pw,pl);
    const sW=pm.reduce((a,m)=>a+(m.w===selPlayer?m.wS:m.lS),0);
    const sL=pm.reduce((a,m)=>a+(m.w===selPlayer?m.lS:m.wS),0);
    const pS=pct(sW,sL);
    const sorted=[...pm].sort((a,b)=>b.date.localeCompare(a.date));
    body=`
      <div class="stat-grid">
        ${[['🎾','#0a1f5c',pm.length,'Partidos'],['⭐','#e9a800',pw*10,'Puntos'],['✅','#3a7bd5',pw,'Ganados'],['❌','#e05252',pl,'Perdidos']].map(([ic,c,v,l])=>`
          <div class="stat-card">
            <div class="stat-icon">${ic}</div>
            <div class="stat-val" style="color:${c}">${v}</div>
            <div class="stat-lbl">${l}</div>
          </div>`).join('')}
      </div>
      <div class="card">
        <div class="card-title">% Victorias vs Derrotas</div>
        ${statBar(p,pw+' ganados',pl+' perdidos','#3a7bd5')}
      </div>
      <div class="card">
        <div class="card-title">% Sets Ganados vs Perdidos</div>
        ${statBar(pS,sW+' sets ganados',sL+' sets perdidos','#2d9e6b')}
      </div>
      <div class="card">
        <div class="card-title">Historial de partidos</div>
        ${sorted.map(m=>{
          const won=m.w===selPlayer;
          const rival=won?m.l:m.w;
          return `<div class="player-history-item" style="border-left:4px solid ${won?'#3a7bd5':'#e05252'}">
            <div class="player-history-name">vs ${rival} <span style="font-weight:400;color:#888">— ${m.score}</span></div>
            <div class="player-history-date">${m.date} · ${won?'✅ Victoria (+10 pts)':'❌ Derrota (0 pts)'}</div>
          </div>`;
        }).join('')}
      </div>`;
  }
  return `
    <div class="section-title">📊 Estadísticas por Jugador</div>
    <select id="playerSelect" onchange="selPlayer=this.value;render()">
      <option value="">— Selecciona un jugador —</option>
      ${players.map(p=>`<option value="${p}" ${p===selPlayer?'selected':''}>${p}</option>`).join('')}
    </select>
    ${body}`;
}

function renderHistory(){
  const filtered=search
    ?MATCHES.filter(m=>m.w.toLowerCase().includes(search.toLowerCase())||m.l.toLowerCase().includes(search.toLowerCase()))
    :MATCHES;
  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date));
  return `
    <div class="section-title">📋 Historial (${MATCHES.length} partidos)</div>
    <input type="text" placeholder="🔍 Buscar jugador..." value="${search}" oninput="search=this.value;render()" style="margin-bottom:14px"/>
    <div>
      ${sorted.map(m=>`
        <div class="history-item" style="background:#fff;border-left:4px solid #3a7bd5">
          <div class="history-names">${m.w} <span style="color:#bbb;font-weight:400">vs</span> ${m.l}</div>
          <div class="history-detail">📅 ${m.date} · 🏟️ Arcilla · <b>${m.score}</b></div>
          <div class="history-result" style="color:#3a7bd5">✅ Ganó ${m.w}</div>
        </div>`).join('')}
    </div>`;
}

function render(){
  const ranking=buildRanking();
  const tabs=[['ranking','🏆','Ranking'],['stats','📊','Stats'],['history','📋','Historial']];
  document.getElementById('app').innerHTML=`
    <div class="app">
      <div class="header">
        ${racketSVG(140,200,'rotate(-35deg) translate(-20px,170px)',0.09)}
        ${racketSVG(130,190,'rotate(30deg) translate(60px,-10px)',0.09)}
        <div class="ball"></div>
        <div class="header-top">
          <div class="header-info">
            <div class="liga">Liga 2026</div>
            <div class="count">${MATCHES.length} partidos · ${ranking.length} jugadores</div>
          </div>
          ${logo(72)}
        </div>
        <div class="tabs">
          ${tabs.map(([k,ic,l])=>`
            <button class="tab-btn ${tab===k?'active':''}" onclick="tab='${k}';render()">
              <div class="tab-icon">${ic}</div>
              <div>${l}</div>
            </button>`).join('')}
        </div>
      </div>
      <div class="content">
        ${courtSVG()}
        <div class="content-inner">
          ${tab==='ranking'?renderRanking():tab==='stats'?renderStats():renderHistory()}
        </div>
      </div>
    </div>`;
}

render();
</script>
