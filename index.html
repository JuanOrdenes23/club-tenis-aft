<html lang="es">

    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:#0d1117;font-family:'Inter',sans-serif;color:#f0f0f0;overflow-x:hidden}
    .app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:linear-gradient(160deg,#0d1117 0%,#0a1f5c22 100%)}
    .header{background:linear-gradient(135deg,#0a1f5c 0%,#1a3a8f 100%);color:#fff;padding:env(safe-area-inset-top,16px) 0 0;box-shadow:0 4px 24px rgba(0,0,0,0.4);position:relative;overflow:hidden}
    .header-top{padding:16px 16px 14px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
    .header-info .liga{font-size:11px;letter-spacing:3px;opacity:.7;text-transform:uppercase;font-weight:500}
    .header-info .count{font-size:11px;opacity:.5;margin-top:3px}
    .content{padding:16px 14px 100px;position:relative;min-height:calc(100vh - 160px)}
    .content-inner{position:relative;z-index:1}
    .page{animation:fadeSlideIn .3s ease forwards}
    @keyframes fadeSlideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .court-bg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.03;pointer-events:none;z-index:0;max-width:480px;width:100%}
    .section-title{font-weight:800;font-size:18px;color:#fff;margin-bottom:2px;letter-spacing:-0.3px}
    .section-sub{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:16px;letter-spacing:1.5px;text-transform:uppercase;font-weight:500}
    .ranking-list{display:flex;flex-direction:column;gap:10px}
    .rank-card{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 20px rgba(0,0,0,0.2);transition:transform .2s}
    .rank-card:active{transform:scale(0.97)}
    .rank-card.top1{border:1px solid rgba(249,199,79,0.4);background:rgba(249,199,79,0.08)}
    .rank-card.top2{border:1px solid rgba(173,181,189,0.3);background:rgba(173,181,189,0.06)}
    .rank-card.top3{border:1px solid rgba(205,127,50,0.3);background:rgba(205,127,50,0.06)}
    .rank-pos{min-width:38px;text-align:center;font-weight:700}
    .rank-name{font-weight:700;font-size:14px;color:#fff;letter-spacing:-0.2px;cursor:pointer;display:flex;align-items:center;gap:6px}
    .rank-name:active{opacity:0.7}
    .rank-name .arrow{font-size:11px;opacity:0.4}
    .rank-detail{font-size:11px;color:rgba(255,255,255,0.45);margin-top:3px}
    .rank-pts{text-align:right}
    .rank-pts-val{font-weight:900;font-size:22px;color:#f0c040;letter-spacing:-0.5px}
    .rank-pts-lbl{font-size:10px;color:rgba(255,255,255,0.35);font-weight:500;letter-spacing:1px;text-transform:uppercase}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .stat-card{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px 10px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
    .stat-icon{font-size:24px;margin-bottom:4px}
    .stat-val{font-weight:900;font-size:24px;letter-spacing:-0.5px}
    .stat-lbl{font-size:10px;color:rgba(255,255,255,0.45);font-weight:500;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
    .card{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
    .card-title{font-weight:700;font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:10px;text-transform:uppercase;letter-spacing:1.5px}
    .bar-wrap{display:flex;border-radius:10px;overflow:hidden;height:30px}
    .bar-left,.bar-right{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
    .bar-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;font-weight:500}
    .history-item{background:rgba(255,255,255,0.05);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:13px 16px;margin-bottom:10px;transition:transform .2s}
    .history-item:active{transform:scale(0.98)}
    .history-names{font-weight:700;font-size:13px;color:#fff}
    .history-detail{font-size:11px;color:rgba(255,255,255,0.4);margin-top:3px}
    .history-result{font-size:11px;margin-top:4px;font-weight:600}
    .player-history-item{padding-left:12px;margin-bottom:12px}
    .player-history-name{font-size:13px;font-weight:600;color:#fff}
    .player-history-date{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px}
    select,input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);font-size:14px;outline:none;background:rgba(255,255,255,0.07);color:#fff;margin-bottom:16px;font-family:'Inter',sans-serif}
    select option{background:#0d1117;color:#fff}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,15,30,0.9);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
    .nav-btn{flex:1;padding:12px 4px 10px;border:none;cursor:pointer;font-size:9px;font-weight:500;background:transparent;color:rgba(255,255,255,0.4);text-align:center;font-family:'Inter',sans-serif;transition:all .2s ease}
    .nav-btn.active{color:#f0c040;font-weight:700}
    .nav-btn:active{transform:scale(0.9)}
    .nav-icon{font-size:18px;margin-bottom:2px}
    .ball{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d4f542,#a8cc00);box-shadow:0 2px 8px rgba(0,0,0,0.4);z-index:2;pointer-events:none}
    .ball::before{content:'';position:absolute;width:60%;height:100%;border:1.5px solid rgba(255,255,255,0.5);border-radius:50%;border-left-color:transparent;border-right-color:transparent;top:0;left:20%}
    .ball::after{content:'';position:absolute;width:100%;height:60%;border:1.5px solid rgba(255,255,255,0.5);border-radius:50%;border-top-color:transparent;border-bottom-color:transparent;top:20%;left:0}
    @keyframes bounceX{0%,100%{left:5%}50%{left:82%}}
    @keyframes bounceY{0%,100%{top:5px}50%{top:calc(100% - 24px)}}
    .ball{animation:bounceX 4.5s ease-in-out infinite,bounceY 3s ease-in-out infinite}
    .ball-rank{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;color:#111;font-weight:900;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,0.3);position:relative;background:radial-gradient(circle at 35% 35%,#d4f542,#a8cc00)}
    .ball-rank::before{content:'';position:absolute;width:60%;height:100%;border:2px solid rgba(255,255,255,0.55);border-radius:50%;border-left-color:transparent;border-right-color:transparent}
    .ball-rank::after{content:'';position:absolute;width:100%;height:60%;border:2px solid rgba(255,255,255,0.55);border-radius:50%;border-top-color:transparent;border-bottom-color:transparent}
    .ball-rank span{position:relative;z-index:1}
    @keyframes spin{0%{transform:rotateY(0deg)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
    .ball-rank-1{animation:spin 2.5s ease-in-out infinite;animation-delay:0s}
    .ball-rank-2{animation:spin 2.5s ease-in-out infinite;animation-delay:0.8s}
    .ball-rank-3{animation:spin 2.5s ease-in-out infinite;animation-delay:1.6s}
    .racket-svg{position:absolute;pointer-events:none}
    .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .dash-card{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px 12px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
    .dash-val{font-weight:900;font-size:28px;letter-spacing:-1px;margin:6px 0 2px}
    .dash-lbl{font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:1.5px;font-weight:500}
    .dash-icon{font-size:26px}
    .top-player{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06)}

    .top-player-rank{font-size:18px;min-width:28px}
    .top-player-name{font-weight:600;font-size:13px;color:#fff;flex:1}
    .top-player-pts{font-weight:800;font-size:16px;color:#f0c040}
    .streak-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
    .streak-w{background:rgba(82,212,138,0.15);color:#52d48a;border:1px solid rgba(82,212,138,0.3)}
    .streak-l{background:rgba(224,82,82,0.15);color:#e05252;border:1px solid rgba(224,82,82,0.3)}
    .recent-match{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
    .recent-match:last-child{border-bottom:none}
    .recent-names{font-size:12px;color:#fff;font-weight:600}
    .recent-date{font-size:10px;color:rgba(255,255,255,0.35);margin-top:2px}
    .mini-bar-wrap{height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,0.08);margin-top:6px}
    .mini-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,#3a7bd5,#52d48a)}
    .month-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
    .month-row:last-child{border-bottom:none}
    .month-name{font-size:12px;color:rgba(255,255,255,0.7);font-weight:500;min-width:60px}
    .month-count{font-size:12px;color:#f0c040;font-weight:700;min-width:40px;text-align:right}

function buildRanking(){
  const p={};
  const e=n=>{if(!p[n])p[n]={name:n,pts:0,played:0,won:0,lost:0};};
  MATCHES.forEach(m=>{e(m.w);e(m.l);p[m.w].played++;p[m.l].played++;p[m.w].pts+=10;p[m.w].won++;p[m.l].lost++;});
  return Object.values(p).sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    const pA=a.played?a.won/a.played:0,pB=b.played?b.won/b.played:0;
    if(pB!==pA) return pB-pA;
    return b.won-a.won;
  });
}

function getAllPlayers(){
  return [...new Set(MATCHES.flatMap(m=>[m.w,m.l]))].sort();
}

function pct(a,b){return (a+b)?Math.round(a/(a+b)*100):0;}

function getStreak(name){
  const pm=[...MATCHES].filter(m=>m.w===name||m.l===name).sort((a,b)=>b.date.localeCompare(a.date));
  if(!pm.length) return {type:'',count:0};
  const first=pm[0].w===name?'w':'l';
  let count=1;
  for(let i=1;i<pm.length;i++){
    const res=pm[i].w===name?'w':'l';
    if(res===first) count++; else break;
  }
  return {type:first,count};
}

function animateCount(el,target,duration){
  const start=performance.now();
  function update(now){
    const p=Math.min((now-start)/duration,1);
    el.textContent=Math.round((1-Math.pow(1-p,3))*target);
    if(p<1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

      ${ranking.filter(p=>p.played>=3).slice(0,5).map((p,i)=>{const pv=Math.round(p.won/p.played*100);return `
        <div class="month-row">
          <div style="font-size:12px;color:#fff;font-weight:600;min-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i+1}. ${p.name.split(' ')[0]}</div>
          <div style="flex:1;margin:0 10px"><div class="mini-bar-wrap"><div class="mini-bar" style="width:${pv}%;background:linear-gradient(90deg,#f0c040,#f97316)"></div></div></div>
          <div style="font-size:12px;color:#f0c040;font-weight:700;min-width:36px;text-align:right">${pv}%</div>
        </div>`;}).join('')}
    </div>
  </div>`;
}

function renderRanking(){
  const ranking=buildRanking();
  return `<div class="page">
    <div class="section-title">Escalerilla</div>
    <div class="section-sub">Liga 2026 · ${ranking.length} jugadores</div>
    <div class="ranking-list">
      ${ranking.map((p,i)=>{const s=getStreak(p.name);return `
        <div class="rank-card ${i===0?'top1':i===1?'top2':i===2?'top3':''}">
          <div class="rank-pos">${i===0?'<div class="ball-rank ball-rank-1"><span>1</span></div>':i===1?'<div class="ball-rank ball-rank-2"><span>2</span></div>':i===2?'<div class="ball-rank ball-rank-3"><span>3</span></div>':'<span style="font-size:15px;color:rgba(255,255,255,0.3)">#'+(i+1)+'</span>'}</div>
          <div style="flex:1">
            <div class="rank-name" onclick="goToStats('${p.name}')">${p.name} <span class="arrow">›</span></div>
            <div class="rank-detail">${p.played} PJ · ${p.won}G / ${p.lost}P · ${p.played?Math.round(p.won/p.played*100):0}%
              ${s.count>=2?`<span class="streak-badge ${s.type==='w'?'streak-w':'streak-l'}" style="margin-left:6px;padding:2px 6px">${s.type==='w'?'🔥':'❄️'}${s.count}</span>`:''}
            </div>
          </div>
          <div class="rank-pts"><div class="rank-pts-val" id="pts-${i}">0</div><div class="rank-pts-lbl">pts</div></div>
        </div>`;}).join('')}
    </div>
  </div>`;
}

function renderStats(){
  const players=getAllPlayers();
  let body='';
  if(selPlayer){
    const pm=MATCHES.filter(m=>m.w===selPlayer||m.l===selPlayer);
    const pw=pm.filter(m=>m.w===selPlayer).length;
    const pl=pm.length-pw;
    const p=pct(pw,pl);
    const sW=pm.reduce((a,m)=>a+(m.w===selPlayer?m.wS:m.lS),0);
    const sL=pm.reduce((a,m)=>a+(m.w===selPlayer?m.lS:m.wS),0);
    const pS=pct(sW,sL);
    const s=getStreak(selPlayer);
    const sorted=[...pm].sort((a,b)=>b.date.localeCompare(a.date));
    const rivals={};
    pm.forEach(m=>{const r=m.w===selPlayer?m.l:m.w;rivals[r]=(rivals[r]||0)+1;});
    const topRival=Object.entries(rivals).sort((a,b)=>b[1]-a[1])[0];
    const hardest=Object.entries(rivals).filter(([r])=>pm.some(m=>m.l===selPlayer&&m.w===r)).sort((a,b)=>{
      const aL=pm.filter(m=>m.l===selPlayer&&m.w===a[0]).length;
      const bL=pm.filter(m=>m.l===selPlayer&&m.w===b[0]).length;
      return bL-aL;
    })[0];
    body=`
      ${s.count>=2?`<div class="card" style="border:1px solid ${s.type==='w'?'rgba(82,212,138,0.3)':'rgba(224,82,82,0.3)'}">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:28px">${s.type==='w'?'🔥':'❄️'}</span>
          <div><div style="font-weight:700;color:#fff">${s.type==='w'?'Racha ganadora':'Racha perdedora'}</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.5)">${s.count} partidos consecutivos ${s.type==='w'?'ganados':'perdidos'}</div></div>
        </div></div>`:''}
      <div class="stat-grid">
        ${[['🎾','#f0c040',pm.length,'Partidos'],['⭐','#f0c040',pw*10,'Puntos'],['✅','#52d48a',pw,'Ganados'],['❌','#e05252',pl,'Perdidos']].map(([ic,c,v,l])=>`
          <div class="stat-card"><div class="stat-icon">${ic}</div><div class="stat-val" style="color:${c}">${v}</div><div class="stat-lbl">${l}</div></div>`).join('')}
      </div>
      <div class="card"><div class="card-title">% Victorias vs Derrotas</div>${statBar(p,pw+' ganados',pl+' perdidos','#3a7bd5')}</div>
      <div class="card"><div class="card-title">% Sets Ganados vs Perdidos</div>${statBar(pS,sW+' sets ganados',sL+' sets perdidos','#2d9e6b')}</div>
      ${topRival||hardest?`<div class="card"><div class="card-title">🎯 Análisis de rivales</div>
        ${topRival?`<div class="top-player"><span style="font-size:18px">🤝</span><div style="flex:1;margin-left:10px"><div style="font-size:11px;color:rgba(255,255,255,0.5)">Rival más frecuente</div><div style="font-weight:700;color:#fff">${topRival[0]}</div></div><div style="font-size:12px;color:#f0c040">${topRival[1]} PJ</div></div>`:''}
        ${hardest?`<div class="top-player"><span style="font-size:18px">⚔️</span><div style="flex:1;margin-left:10px"><div style="font-size:11px;color:rgba(255,255,255,0.5)">Rival más difícil</div><div style="font-weight:700;color:#fff">${hardest[0]}</div></div></div>`:''}
      </div>`:''}
      <div class="card"><div class="card-title">Historial de partidos</div>
        ${sorted.map(m=>{const won=m.w===selPlayer;const rival=won?m.l:m.w;return `
          <div class="player-history-item" style="border-left:3px solid ${won?'#52d48a':'#e05252'}">
            <div class="player-history-name">vs ${rival} <span style="font-weight:400;color:rgba(255,255,255,0.4)">— ${m.score}</span></div>
            <div class="player-history-date">${m.date} · ${won?'✅ Victoria (+10 pts)':'❌ Derrota (0 pts)'}</div>
          </div>`;}).join('')}
      </div>`;
  }
  return `<div class="page">
    <div class="section-title">Estadísticas</div>
    <div class="section-sub">Por jugador</div>
    <select id="playerSelect" onchange="selPlayer=this.value;render()">
      <option value="">— Selecciona un jugador —</option>
      ${players.map(p=>`<option value="${p}" ${p===selPlayer?'selected':''}>${p}</option>`).join('')}
    </select>
    ${body}
  </div>`;
}

function renderHistory(){
  const filtered=search?MATCHES.filter(m=>m.w.toLowerCase().includes(search.toLowerCase())||m.l.toLowerCase().includes(search.toLowerCase())):MATCHES;
  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="page">
    <div class="section-title">Historial</div>
    <div class="section-sub">${MATCHES.length} partidos registrados</div>
    <input type="text" placeholder="🔍 Buscar jugador..." value="${search}" oninput="search=this.value;render()"/>
    <div>${sorted.map(m=>`
      <div class="history-item" style="border-left:3px solid #52d48a">
        <div class="history-names">${m.w} <span style="color:rgba(255,255,255,0.3);font-weight:400">vs</span> ${m.l}</div>
        <div class="history-detail">📅 ${m.date} · 🏟️ Arcilla · <b style="color:rgba(255,255,255,0.7)">${m.score}</b></div>
        <div class="history-result" style="color:#52d48a">✅ Ganó ${m.w}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

function render(){
  const ranking=buildRanking();
  const allPlayers=getAllPlayers();
  const navItems=[['dashboard','📊','Dashboard'],['ranking','🏆','Ranking'],['stats','👤','Stats'],['history','📋','Historial']];
  document.getElementById('app').innerHTML=`
    <div class="app">
      <div class="header">
        ${racketSVG(140,200,'rotate(-35deg) translate(-20px,170px)',0.09)}
        ${racketSVG(130,190,'rotate(30deg) translate(60px,-10px)',0.09)}
        <div class="ball"></div>
        <div class="header-top">
          <div class="header-info">
            <div class="liga">Liga 2026</div>
            <div class="count">${MATCHES.length} partidos · ${allPlayers.length} jugadores</div>
          </div>
          ${logo(72)}
        </div>
      </div>
      <div class="content">
        ${courtSVG()}
        <div class="content-inner">
          ${tab==='dashboard'?renderDashboard():tab==='ranking'?renderRanking():tab==='stats'?renderStats():renderHistory()}
        </div>
      </div>
      <nav class="bottom-nav">
        ${navItems.map(([k,ic,l])=>`
          <button class="nav-btn ${tab===k?'active':''}" onclick="tab='${k}';render()">
            <div class="nav-icon">${ic}</div><div>${l}</div>
          </button>`).join('')}
      </nav>
    </div>`;
  if(tab==='ranking'){
    ranking.forEach((p,i)=>{
      const el=document.getElementById('pts-'+i);
      if(el) animateCount(el,p.pts,1200+i*80);
    });
  }
}

render();
</script>
</body>
</html>
